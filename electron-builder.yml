appId: fr.insrt.2listen
productName: 2Listen
copyright: © 2026 Thibault Pierens

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - "!node_modules/**"

# ⚠️ Adapter owner/repo si le dépôt GitHub a un autre nom.
publish:
  provider: github
  owner: thibaultpierens
  repo: 2listen
  # publie directement (pas de brouillon) pour que electron-updater voie la release
  releaseType: release

mac:
  category: public.app-category.music
  icon: build/icon.icns
  # zip pour electron-updater ; le .dmg stylisé est fabriqué par scripts/make-dmg.sh
  target:
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  # Pas de certificat Developer ID → build non signé (voir README)
  identity: null


npmRebuild: false
