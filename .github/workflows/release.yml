name: Release

# Chaque push sur main produit une release GitHub avec le .dmg (+ .zip pour
# l'auto-update). La version est dérivée du run : 0.1.N — strictement
# croissante, donc electron-updater la détecte toujours comme plus récente.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version auto-incrémentée
        run: |
          VERSION="0.1.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Icône
        run: node scripts/make-icon.mjs

      - name: Build + publication GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pas de certificat : on désactive la découverte de signature
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release

  typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
