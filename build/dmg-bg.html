<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 660px; height: 420px; overflow: hidden; }
  body {
    background: #ece9e2;
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    color: #111;
    position: relative;
  }
  /* cadre épais */
  .frame { position: absolute; inset: 10px; border: 4px solid #111; }
  .inner { position: absolute; inset: 18px; }

  .kicker {
    position: absolute; top: 26px; left: 34px;
    font: 700 10px/1 'Fragment Mono', ui-monospace, monospace;
    letter-spacing: .22em; color: #ff4d00;
  }
  .word {
    position: absolute; top: 44px; left: 32px;
    font-weight: 700; font-size: 56px; letter-spacing: -0.03em;
  }
  .word span { color: #ff4d00; }
  .tag {
    position: absolute; top: 58px; right: 34px; text-align: right;
    font: 400 10px/1.65 'Fragment Mono', ui-monospace, monospace; color: #77726a;
  }

  /* forme d'onde décorative */
  .wave { position: absolute; left: 34px; right: 34px; top: 122px; height: 46px; display: flex; align-items: center; gap: 3px; }
  .wave i { flex: 1; background: #111; opacity: .85; }
  .wave i.o { background: #ff4d00; opacity: 1; }

  /* zones de dépôt : l'icône app (~100px) se pose à x=170,y=265 ; Applications à x=490,y=265 (centres) */
  .slot {
    position: absolute; width: 128px; height: 128px; top: 201px;
    border: 3px dashed #111; opacity: .55;
  }
  .slot.app  { left: 106px; }
  .slot.dest { left: 426px; }

  .arrow {
    position: absolute; top: 253px; left: 258px; width: 144px; height: 24px;
  }
  .arrow .line { position: absolute; top: 10px; left: 0; right: 22px; height: 5px; background: #ff4d00; }
  .arrow .head {
    position: absolute; right: 0; top: 0;
    width: 0; height: 0;
    border-top: 12px solid transparent; border-bottom: 12px solid transparent;
    border-left: 22px solid #ff4d00;
  }

  .hint {
    position: absolute; bottom: 26px; left: 0; right: 0; text-align: center;
    font: 700 11px/1 'Fragment Mono', ui-monospace, monospace; letter-spacing: .26em;
  }
  .hint em { font-style: normal; background: #ff4d00; padding: 3px 8px; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="kicker">LECTEUR LOSSLESS LOCAL — MACOS</div>
  <div class="word">2<span>Listen</span></div>
  <div class="tag">FLAC · ALAC · WAV · AIFF<br>bit-perfect, hors ligne</div>
  <div class="wave" id="wave"></div>
  <div class="slot app"></div>
  <div class="slot dest"></div>
  <div class="arrow"><div class="line"></div><div class="head"></div></div>
  <div class="hint"><em>GLISSEZ</em>&nbsp;&nbsp;POUR INSTALLER</div>
  <script>
    // silhouette de morceau : intro / montée / drop / outro
    const hs = [.14,.3,.2,.44,.34,.6,.46,.76,.6,.9,.76,1,.82,.94,.62,.8,.5,.66,.36,.5,.24,.36,.14,.22,
                .3,.5,.4,.66,.54,.84,.7,.96,.8,1,.86,.9,.7,.78,.54,.6,.4,.46,.26,.32,.16,.2,.1,.14]
    const w = document.getElementById('wave')
    hs.forEach((h, i) => {
      const b = document.createElement('i')
      b.style.height = Math.round(h * 100) + '%'
      if (i === 9 || i === 33) b.className = 'o'
      w.appendChild(b)
    })
  </script>
</body>
</html>
